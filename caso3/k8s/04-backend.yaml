apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: tres-capas
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: backend-tres-capas:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: mongo-credentials

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: tres-capas
spec:
  selector:
    app: backend
  ports:
    - port: 3000
      targetPort: 3000
