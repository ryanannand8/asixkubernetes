apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tres-capas
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: frontend-env
          volumeMounts:
            - name: files
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: default.conf.template
            - name: files
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: files
          configMap:
            name: frontend-files
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: tres-capas
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
